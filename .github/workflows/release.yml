name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify tag matches the app version
        run: node scripts/check-release-tag.cjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Require macOS signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.ORBIT_MAC_CERTIFICATE_P12 }}
          CSC_NAME: ${{ secrets.ORBIT_MAC_CERTIFICATE_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.ORBIT_MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.ORBIT_APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.ORBIT_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ORBIT_APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_NAME CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for $name. See docs/operations.md, 'Publishing macOS releases'."
              exit 1
            fi
          done
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/OrbitAuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/OrbitAuthKey.p8" >> "$GITHUB_ENV"
      - name: Compile the release updater into Orbit
        run: npm run build:compile
        env:
          ORBIT_RELEASE_BUILD: "1"
      - name: Package, sign, notarize, and publish the release
        run: ./node_modules/.bin/electron-builder --config electron-builder.release.yml --mac dmg zip --x64 --arm64 --publish onTag
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.ORBIT_MAC_CERTIFICATE_P12 }}
          CSC_NAME: ${{ secrets.ORBIT_MAC_CERTIFICATE_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.ORBIT_MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.ORBIT_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ORBIT_APPLE_API_ISSUER }}
