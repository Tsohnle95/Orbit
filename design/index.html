<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mira Session Panel Directions</title>
    <link rel="stylesheet" href="./session-panels.css" />
  </head>
  <body>
    <svg class="symbol-sprite" aria-hidden="true">
      <symbol id="icon-chevron" viewBox="0 0 16 16">
        <path d="m5.5 6.25 2.5 2.5 2.5-2.5" />
      </symbol>
      <symbol id="icon-expand" viewBox="0 0 16 16">
        <path d="M3.25 5.5V3.25H5.5M10.5 3.25h2.25V5.5M12.75 10.5v2.25H10.5M5.5 12.75H3.25V10.5" />
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 16 16">
        <path d="M2.25 4.25h4l1.1 1.35h6.4v6.15a1 1 0 0 1-1 1H3.25a1 1 0 0 1-1-1z" />
      </symbol>
      <symbol id="icon-history" viewBox="0 0 16 16">
        <path d="M3.2 5.25A5.25 5.25 0 1 1 2.75 9M3.2 5.25V2.8M3.2 5.25h2.45M8 4.9v3.3l2.15 1.25" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 16 16">
        <path d="M4 2.25h5l3 3v8.5H4zM9 2.25v3h3" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 16 16">
        <path d="M8 3.25v9.5M3.25 8h9.5" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 16 16">
        <circle cx="7" cy="7" r="3.75" />
        <path d="m9.75 9.75 3 3" />
      </symbol>
      <symbol id="icon-star" viewBox="0 0 16 16">
        <path d="m8 2.3 1.65 3.35 3.7.54-2.68 2.61.63 3.69L8 10.75l-3.3 1.74.63-3.69-2.68-2.61 3.7-.54z" />
      </symbol>
      <symbol id="icon-more" viewBox="0 0 16 16">
        <circle cx="3.5" cy="8" r=".75" />
        <circle cx="8" cy="8" r=".75" />
        <circle cx="12.5" cy="8" r=".75" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 16 16">
        <path d="m4.5 4.5 7 7M11.5 4.5l-7 7" />
      </symbol>
    </svg>

    <main class="review-shell">
      <header class="review-header">
        <div class="review-heading">
          <span class="review-kicker">Mira design study</span>
          <h1>Session panel directions</h1>
          <p>100 clean options constrained to the file panel’s existing visual language.</p>
        </div>
        <div class="review-controls">
          <label class="review-search">
            <svg><use href="#icon-search"></use></svg>
            <input id="design-search" type="search" placeholder="Find a direction…" autocomplete="off" />
          </label>
          <label class="review-filter">
            <span>Family</span>
            <select id="family-filter">
              <option value="all">All 100</option>
            </select>
          </label>
          <button id="theme-toggle" class="review-button" type="button">Dark preview</button>
        </div>
      </header>

      <div class="constraint-line" aria-label="Design constraints">
        <span>System UI</span>
        <span>11.75–13px titles</span>
        <span>400–525 weights</span>
        <span>28–40px rows</span>
        <span>Cream · beige · sage</span>
        <span>No card stacks</span>
      </div>

      <div class="results-line">
        <span id="results-count">100 directions</span>
        <span id="selection-count">Nothing selected</span>
      </div>

      <section id="design-gallery" class="design-gallery" aria-live="polite"></section>
    </main>

    <aside id="selection-tray" class="selection-tray" aria-label="Selected directions">
      <div>
        <span class="selection-label">Shortlist</span>
        <div id="selection-items" class="selection-items"></div>
      </div>
      <button id="selection-clear" type="button">Clear</button>
    </aside>

    <script src="./session-panels.js"></script>
  </body>
</html>
