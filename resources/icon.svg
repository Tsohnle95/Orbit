<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="midnight" x1="180" y1="120" x2="860" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2a42"/>
      <stop offset="0.52" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#080f1b"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="0.5" cy="0.42" r="0.62">
      <stop stop-color="#6c86a9" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#314765" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#080f1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit-silver" x1="150" y1="240" x2="880" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbff"/>
      <stop offset="0.48" stop-color="#c8d5e7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="orbit-white" x1="870" y1="260" x2="160" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#aabbd2"/>
      <stop offset="1" stop-color="#f5f9ff"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="35%" cy="28%" r="78%">
      <stop stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#e5eefb"/>
      <stop offset="1" stop-color="#a9bdd8"/>
    </radialGradient>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity="0.46"/>
    </filter>
    <filter id="core-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect x="88" y="88" width="848" height="848" rx="194" fill="url(#midnight)"/>
  <rect x="88" y="88" width="848" height="848" rx="194" fill="url(#atmosphere)"/>
  <rect x="88.5" y="88.5" width="847" height="847" rx="193.5" fill="none" stroke="#8da3c0" stroke-opacity="0.18"/>

  <g fill="none" stroke-linecap="round" filter="url(#mark-shadow)">
    <ellipse cx="512" cy="512" rx="338" ry="150" transform="rotate(27 512 512)" stroke="url(#orbit-silver)" stroke-width="30"/>
    <ellipse cx="512" cy="512" rx="338" ry="150" transform="rotate(-27 512 512)" stroke="url(#orbit-white)" stroke-width="30"/>
  </g>

  <circle cx="512" cy="512" r="94" fill="#d8e6f8" opacity="0.22" filter="url(#core-glow)"/>
  <circle cx="512" cy="512" r="76" fill="url(#nucleus)" filter="url(#mark-shadow)"/>
</svg>
